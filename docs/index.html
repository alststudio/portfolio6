<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NORTHVALE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@1&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c;
  --ink:#f1efec;
  --mute:#8d8a86;
  --red:#b3121b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  background:radial-gradient(ellipse 70% 55% at 50% 40%,#18181a,#0b0b0c);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#art{
  position:absolute;
  width:1500px;height:1000px;
  transform-origin:0 0;
  background:radial-gradient(ellipse 70% 55% at 50% 40%,#18181a,#0b0b0c);
}
.ui{font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.pill{
  height:34px;padding:0 20px;
  border:1px solid rgba(241,239,236,.6);
  border-radius:40px;
  display:inline-grid;place-items:center;
  transition:background .25s,color .25s;
}
.pill:hover{background:var(--ink);color:var(--bg)}
.dim{transition:opacity .7s cubic-bezier(.2,.8,.2,1),filter .7s}
body.open .dim{opacity:.12;filter:blur(2px)}
body.open .dimmer{opacity:0;pointer-events:none}
#about{position:absolute;left:46px;top:46px}
#logo{
  position:absolute;left:50%;top:26px;transform:translateX(-50%);
  font-family:"UnifrakturMaguntia",serif;
  font-weight:400;font-size:64px;line-height:1;letter-spacing:.01em;color:var(--ink);
}
#contact{position:absolute;right:46px;top:46px}
#rail{
  position:absolute;left:150px;right:150px;top:254px;height:12px;border-radius:6px;
  background:linear-gradient(#fafafa 0%,#b9bcc1 28%,#5d6066 55%,#a9adb3 78%,#e6e7e9 100%);
  box-shadow:0 10px 18px rgba(0,0,0,.45);
}
#rail::before,#rail::after{
  content:"";position:absolute;width:16px;height:30px;border-radius:5px;top:-9px;
  background:linear-gradient(90deg,#8d9096,#f3f3f4 45%,#7a7d83);
}
#rail::before{left:-14px}
#rail::after{right:-14px}
#rack{position:absolute;left:0;top:0;width:1500px;height:1000px}
.g{
  position:absolute;top:236px;width:289px;height:300px;margin-left:-144.5px;
  perspective:900px;cursor:pointer;
  transition:left .75s cubic-bezier(.2,.8,.2,1);
}
.g i{
  position:absolute;inset:0;background-repeat:no-repeat;
  transform-origin:50% 4%;
  transform:rotateY(-74deg);
  filter:brightness(.88) drop-shadow(0 18px 18px rgba(0,0,0,.5));
  transition:transform .75s cubic-bezier(.2,.8,.2,1),filter .75s;
}
.g.face i{
  transform:rotateY(0deg);
  filter:brightness(1) drop-shadow(0 22px 26px rgba(0,0,0,.55));
}
#cap{
  position:absolute;top:552px;left:750px;transform:translateX(-50%);
  text-align:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mute);white-space:nowrap;pointer-events:none;opacity:0;
  transition:left .75s cubic-bezier(.2,.8,.2,1),opacity .35s;
}
#cap.on{opacity:1}
body.open #cap{opacity:0}
#cap b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
#avail{position:absolute;left:50%;top:790px;transform:translateX(-50%)}
#band{
  position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--red);
  overflow:hidden;display:flex;align-items:center;
}
#track{
  display:flex;white-space:nowrap;
  font-size:13px;font-weight:600;letter-spacing:.14em;
  animation:marq 22s linear infinite;
}
#track span{padding-right:22px}
@keyframes marq{to{transform:translateX(-50%)}}
#det{position:absolute;inset:0;pointer-events:none}
body.open #det{pointer-events:auto}
body.open #det button{pointer-events:auto}
#det .hit{position:absolute;inset:0}
#big2{
  position:absolute;left:50%;top:244px;width:473px;height:492px;margin-left:-236.5px;
  background-repeat:no-repeat;opacity:0;pointer-events:none;
}
#big{
  position:absolute;left:50%;top:244px;width:473px;height:492px;margin-left:-236.5px;
  background-repeat:no-repeat;transform-origin:50% 4%;opacity:0;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));
}
.arr{
  position:absolute;top:452px;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(241,239,236,.5);
  display:grid;place-items:center;opacity:0;
  transition:opacity .4s .25s,background .2s,color .2s;
}
.arr:hover{background:var(--ink);color:var(--bg)}
#prev{left:calc(50% - 300px)}
#next{left:calc(50% + 254px)}
body.open .arr{opacity:1}
#info{
  position:absolute;left:50%;top:770px;transform:translateX(-50%);
  text-align:center;opacity:0;transition:opacity .5s .25s;
}
body.open #info{opacity:1}
#num{font-size:11px;letter-spacing:.16em;color:var(--mute)}
#pname{
  font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;
  font-size:40px;line-height:1.15;color:var(--ink);
  margin:8px 0 6px;
}
#pprice{font-size:13px;letter-spacing:.08em;color:var(--mute);margin-bottom:18px}
#close{
  position:absolute;right:46px;top:46px;opacity:0;
  transition:opacity .4s .25s;
}
body.open #close{opacity:1}
</style>
</head>
<body>
<div id="art">
  <div id="about" class="ui dim">Tentang</div>
  <div id="logo" class="dim">Northvale</div>
  <div id="contact" class="ui dim dimmer">Kontak</div>
  <div id="rail" class="dim"></div>
  <div id="rack" class="dim"></div>
  <div id="cap" class="dimmer"><b id="capName"></b><span id="capPrice"></span></div>
  <button id="avail" class="pill ui dim dimmer">Lihat Ketersediaan</button>
  <div id="band" class="dimmer"><div id="track"></div></div>
  <div id="det">
    <div class="hit"></div>
    <div id="big2"></div>
    <div id="big"></div>
    <button id="prev" class="arr" aria-label="Sebelumnya"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5L8 12L15 19"/></svg></button>
    <button id="next" class="arr" aria-label="Berikutnya"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5L16 12L9 19"/></svg></button>
    <div id="info">
      <div id="num"></div>
      <div id="pname"></div>
      <div id="pprice"></div>
      <button class="pill ui">Lihat Ketersediaan</button>
    </div>
    <button id="close" class="ui">Tutup</button>
  </div>
</div>
<script>

var POLY = [

'polygon(48.86% 5.09%,45.92% 7.92%,46.51% 8.49%,52.59% 9.06%,50.82% 11.89%,50.63% 14.72%,32.97% 20.38%,27.86% 22.64%,23.74% 27.17%,14.91% 39.62%,15.50% 40.75%,21.78% 44.72%,23.94% 46.98%,25.71% 47.55%,26.10% 76.42%,25.31% 91.70%,25.51% 92.26%,63.58% 92.83%,71.82% 95.09%,76.14% 95.09%,76.73% 94.53%,76.92% 90.57%,76.14% 69.06%,76.53% 49.25%,77.32% 46.42%,80.26% 43.58%,83.99% 41.32%,84.58% 40.19%,76.73% 24.34%,74.96% 22.08%,52.59% 14.72%,52.39% 12.45%,54.55% 7.92%,54.16% 6.23%,52.79% 5.09%)',
'polygon(52.00% 2.83%,49.06% 4.53%,48.47% 9.62%,42.39% 10.19%,38.85% 11.32%,29.24% 15.85%,27.47% 18.11%,24.92% 26.04%,22.96% 35.66%,20.02% 44.15%,17.46% 58.87%,16.09% 74.72%,17.46% 89.43%,17.86% 90.00%,24.92% 91.70%,26.49% 92.83%,68.09% 93.40%,68.09% 94.53%,68.88% 95.09%,77.32% 95.09%,82.42% 93.96%,82.81% 92.83%,83.79% 84.34%,83.79% 73.02%,76.33% 19.25%,74.96% 16.98%,73.39% 15.85%,64.17% 11.32%,61.03% 10.19%,51.22% 9.62%,51.22% 6.79%,57.10% 5.66%,56.12% 3.96%,53.57% 2.83%)',
'polygon(52.00% 2.83%,50.43% 3.40%,48.86% 5.09%,48.47% 9.62%,40.03% 10.19%,38.46% 10.75%,26.69% 15.85%,22.57% 19.25%,11.38% 43.02%,11.58% 45.28%,20.21% 50.38%,27.08% 51.51%,27.47% 85.47%,28.06% 95.09%,29.04% 95.66%,40.62% 95.66%,67.11% 95.09%,67.11% 69.06%,67.90% 65.09%,86.15% 40.19%,87.32% 37.92%,86.73% 37.36%,88.89% 36.79%,88.30% 32.26%,83.20% 31.70%,83.20% 30.00%,78.89% 19.25%,79.08% 18.11%,77.12% 17.55%,78.49% 16.98%,75.75% 16.42%,72.80% 14.72%,72.61% 14.15%,74.18% 13.58%,73.78% 13.02%,66.92% 11.89%,67.50% 11.32%,61.62% 10.19%,51.41% 9.62%,51.41% 6.79%,57.10% 5.66%,56.12% 3.96%,53.77% 2.83%)',
'polygon(52.00% 2.83%,50.43% 3.40%,48.86% 5.09%,48.47% 9.62%,40.82% 10.19%,39.84% 10.75%,38.46% 14.72%,23.35% 22.08%,20.21% 26.60%,17.66% 36.23%,17.46% 46.42%,16.09% 56.60%,15.89% 85.47%,17.07% 95.66%,82.22% 95.66%,82.61% 91.13%,83.79% 88.30%,83.99% 61.13%,83.79% 55.47%,82.42% 49.81%,81.83% 34.53%,80.65% 29.43%,78.89% 24.91%,76.92% 22.64%,62.21% 15.28%,60.05% 10.75%,59.07% 10.19%,51.41% 9.62%,51.41% 6.79%,57.10% 5.66%,56.12% 3.96%,53.77% 2.83%)',
'polygon(52.00% 2.83%,50.24% 3.40%,48.67% 5.09%,48.27% 9.62%,37.09% 10.19%,27.86% 15.28%,24.53% 20.94%,12.56% 52.08%,6.67% 69.06%,4.12% 78.68%,4.32% 79.25%,14.72% 82.08%,17.07% 82.08%,17.27% 81.51%,82.42% 80.94%,95.37% 75.85%,88.11% 54.34%,73.39% 20.94%,69.07% 14.15%,66.33% 12.45%,60.83% 10.19%,51.22% 9.62%,51.22% 6.79%,56.91% 5.66%,56.12% 3.96%,53.57% 2.83%)',
'polygon(52.00% 2.83%,50.43% 3.40%,48.86% 5.09%,48.47% 9.62%,36.89% 10.19%,35.71% 12.45%,31.00% 17.55%,26.10% 21.51%,24.53% 24.34%,22.37% 31.13%,16.29% 57.74%,12.95% 78.68%,12.56% 86.60%,13.74% 89.43%,13.34% 93.96%,15.89% 94.53%,21.78% 94.53%,81.63% 93.96%,86.15% 93.40%,86.73% 92.83%,87.13% 80.94%,85.95% 71.32%,81.63% 48.68%,77.71% 32.26%,75.16% 24.34%,73.00% 20.94%,68.68% 17.55%,63.58% 11.89%,62.99% 10.19%,51.41% 9.62%,51.41% 6.79%,57.10% 5.66%,56.12% 3.96%,53.77% 2.83%)',
'polygon(52.00% 2.83%,49.06% 4.53%,48.47% 6.23%,48.47% 10.19%,37.68% 10.75%,30.81% 14.72%,24.92% 19.25%,17.46% 27.74%,7.85% 41.32%,8.63% 42.45%,21.59% 52.08%,20.60% 61.13%,20.60% 82.08%,21.39% 95.09%,77.51% 95.09%,78.30% 94.53%,78.49% 92.26%,79.47% 71.89%,79.47% 62.83%,78.30% 52.08%,92.03% 41.32%,77.71% 22.08%,71.82% 16.98%,62.21% 10.75%,51.22% 10.19%,51.22% 6.79%,57.10% 5.66%,56.12% 3.96%,53.57% 2.83%)',
'polygon(52.00% 2.83%,50.43% 3.40%,48.86% 5.09%,48.47% 10.19%,45.72% 10.75%,42.78% 12.45%,40.62% 14.72%,37.28% 20.38%,35.71% 24.91%,38.85% 29.43%,38.46% 30.00%,29.24% 34.53%,22.96% 39.06%,11.97% 71.32%,10.79% 76.42%,10.79% 82.08%,16.09% 83.77%,29.04% 84.34%,29.24% 85.47%,68.49% 85.47%,68.88% 84.34%,83.40% 83.77%,89.29% 81.51%,88.30% 78.11%,88.30% 75.28%,84.58% 62.83%,74.76% 37.92%,58.87% 29.43%,62.40% 24.34%,60.64% 19.81%,57.50% 14.72%,55.34% 12.45%,51.41% 10.19%,51.41% 6.79%,57.10% 5.66%,56.12% 3.96%,53.77% 2.83%)'
];

var hov = -1, open = -1;
var art = document.getElementById('art');
var rack = document.getElementById('rack');
var cap = document.getElementById('cap');
var capName = document.getElementById('capName');
var capPrice = document.getElementById('capPrice');
var big = document.getElementById('big');
var big2 = document.getElementById('big2');
var numEl = document.getElementById('num');
var pnameEl = document.getElementById('pname');
var ppriceEl = document.getElementById('pprice');
var G = [];

function paint(el, k) {
  var ew = el.offsetWidth, eh = el.offsetHeight;
  var sx = ew / BW, sy = eh / CH;
  var xbox = (k % 5) * CW - PAD;
  var ybox = ROWY[Math.floor(k / 5)];
  el.style.backgroundImage = 'url(' + SHEET + ')';
  el.style.backgroundSize = (SW / BW * ew) + 'px ' + (SH / CH * eh) + 'px';
  el.style.backgroundPosition = (-xbox * sx) + 'px ' + (-ybox * sy) + 'px';
  el.style.clipPath = POLY[k];
}

function layout() {
  for (var k = 0; k < N; k++) {
    var x = CX + (k - (N - 1) / 2) * SLOT;
    if (hov >= 0 && k !== hov) x += Math.sign(k - hov) * OPEN;
    G[k].style.left = x + 'px';
    G[k].classList.toggle('face', k === hov);
  }
  if (hov >= 0) {
    cap.style.left = G[hov].style.left;
    capName.textContent = PRODUCTS[hov].name;
    capPrice.textContent = PRODUCTS[hov].price;
    cap.classList.add('on');
  } else {
    cap.classList.remove('on');
  }
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function fill(k) {
  numEl.textContent = pad2(k + 1) + ' / ' + pad2(N);
  pnameEl.textContent = PRODUCTS[k].name;
  ppriceEl.textContent = PRODUCTS[k].price;
}

function openG(k) {
  if (open >= 0) return;
  open = k; hov = k; layout();
  var gx = parseFloat(G[k].style.left);
  big.getAnimations().forEach(function (a) { a.cancel(); });
  big.style.opacity = '';
  paint(big, k);
  fill(k);
  document.body.classList.add('open');
  big.animate([
    { transform: 'translate(' + (gx - 750) + 'px,-8px) scale(.61)', opacity: 1 },
    { transform: 'none', opacity: 1 }
  ], { duration: 750, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
  G[k].style.visibility = 'hidden';
}

function step(d) {
  if (open < 0) return;
  var from = open;
  open = (open + d + N) % N;
  fill(open);
  G[from].style.visibility = '';
  G[open].style.visibility = 'hidden';
  hov = open; layout();
  paint(big2, from);
  big2.animate([
    { transform: 'none', opacity: 1, filter: 'blur(0px)' },
    { transform: 'translateX(' + (-d * 120) + 'px) scale(.94)', opacity: 0, filter: 'blur(6px)' }
  ], { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)' });
  big.getAnimations().forEach(function (a) { a.cancel(); });
  paint(big, open);
  big.animate([
    { transform: 'translateX(' + (d * 120) + 'px) scale(.94)', opacity: 0, filter: 'blur(6px)' },
    { transform: 'none', opacity: 1, filter: 'blur(0px)' }
  ], { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
}

function closeG() {
  if (open < 0) return;
  var k = open;
  var gx = parseFloat(G[k].style.left);
  big.animate([
    { transform: 'none', opacity: 1 },
    { transform: 'translate(' + (gx - 750) + 'px,-8px) scale(.61)', opacity: 1 }
  ], { duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
  document.body.classList.remove('open');
  setTimeout(function () {
    G[k].style.visibility = '';
    big.getAnimations().forEach(function (a) { a.cancel(); });
    big.style.opacity = '0';
    open = -1; hov = -1; layout();
  }, 650);
}

function setHov(k) { hov = k; layout(); }

for (var k = 0; k < N; k++) {
  (function (k) {
    var g = document.createElement('div');
    g.className = 'g';
    var i = document.createElement('i');
    g.appendChild(i);
    rack.appendChild(g);
    G.push(g);
    paint(i, k);
    g.addEventListener('pointerenter', function () { if (open < 0) { hov = k; layout(); } });
    g.addEventListener('click', function () { openG(k); });
  })(k);
}
rack.addEventListener('pointerleave', function () { if (open < 0) { hov = -1; layout(); } });

var track = document.getElementById('track');
var seq = ['NORTHVALE', '•', 'EDISI TERBATAS', '•', 'TIDAK RESTOCK', '•'];
for (var r = 0; r < 16; r++) {
  for (var s = 0; s < seq.length; s++) {
    var sp = document.createElement('span');
    sp.textContent = seq[s];
    track.appendChild(sp);
  }
}

document.getElementById('prev').addEventListener('click', function () { step(-1); });
document.getElementById('next').addEventListener('click', function () { step(1); });
document.getElementById('close').addEventListener('click', closeG);
document.querySelector('#det .hit').addEventListener('click', closeG);

window.addEventListener('keydown', function (e) {
  if (open >= 0) {
    if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'Escape') closeG();
  } else {
    if (e.key === 'ArrowRight') { hov = Math.min(N - 1, hov + 1); layout(); }
    else if (e.key === 'ArrowLeft') { hov = hov < 0 ? N - 1 : Math.max(0, hov - 1); layout(); }
    else if (e.key === 'Enter') { if (hov >= 0) openG(hov); }
  }
});

function fit() {
  var k = Math.min(window.innerWidth / 1500, window.innerHeight / 1000);
  var left = (window.innerWidth - 1500 * k) / 2;
  var top = (window.innerHeight - 1000 * k) / 2;
  art.style.transform = 'scale(' + k + ')';
  art.style.left = left + 'px';
  art.style.top = top + 'px';
  document.body.style.backgroundSize = (1500 * k) + 'px ' + (1000 * k) + 'px';
  document.body.style.backgroundPosition = left + 'px ' + top + 'px';
}
window.addEventListener('resize', fit);
fit();
layout();

window.__closet = { openG: openG, step: step, closeG: closeG, setHov: setHov };
</script>

</html>
